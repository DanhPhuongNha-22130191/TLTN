# Do not store credentials here - map to environment variables.
# For local run: cp env.example .env

spring:
  config:
    import: optional:file:.env[.properties]

  application:
    name: chat-service

  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD}

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${JWT_ISSUER_URI:http://localhost:8081/realms/master}
          jwk-set-uri: ${JWT_JWK_SET_URI:http://localhost:8081/realms/master/protocol/openid-connect/certs}

server:
  port: ${SERVER_PORT}

app:
  user-service:
    url: ${USER_SERVICE_URL:http://localhost:8082}
  presence:
    ttl: ${PRESENCE_TTL:75s}

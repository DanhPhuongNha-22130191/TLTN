# Do not store credentials here - map to environment variables.
# For local run: cp env.example .env

spring:
  config:
    import: optional:file:.env[.properties]

  application:
    name: chat-service

  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB

server:
  port: ${SERVER_PORT}

app:
  user-service:
    url: ${USER_SERVICE_URL:http://localhost:8082}

version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: chat-service-db
    ports:
      - "5433:5432"
    environment:
      POSTGRES_DB: chat_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: always

  chat-service:
    image: phuongnha/chat-service:latest
    container_name: chat-service-app
    ports:
      - "8083:8083"
    environment:
      - SPRING_PROFILES_ACTIVE=dev
      - SERVER_PORT=8083
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=chat_db
      - DB_USER=postgres
      - DB_PASSWORD=postgres
      - USER_SERVICE_URL=http://host.docker.internal:8082
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - postgres
    restart: always

volumes:
  postgres_data:

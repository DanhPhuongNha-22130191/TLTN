services:

  # =========================
  # Mailu Internal Mail
  # =========================
  mail-redis:
    image: redis:7-alpine
    container_name: mail-redis
    restart: always
    volumes:
      - mail_redis_data:/data
    networks:
      - mail-network

  mail-front:
    image: ghcr.io/mailu/nginx:2024.06
    container_name: mail-front
    env_file: mailu.env
    ports:
      - "8085:80"
    volumes:
      - mail_certs:/certs
      - mail_overrides:/overrides:ro
    networks:
      mail-network:
      mail-webmail:
    restart: always

  mail-admin:
    build:
      context: .
      dockerfile: mailu-admin.Dockerfile
    image: secretchat/mailu-admin:2024.06-lan
    container_name: mail-admin
    env_file: mailu.env
    depends_on:
      - mail-redis
    volumes:
      - mail_admin_data:/data
      - mail_dkim:/dkim
    networks:
      - mail-network
    restart: always

  mail-imap:
    image: ghcr.io/mailu/dovecot:2024.06
    container_name: mail-imap
    env_file: mailu.env
    depends_on:
      - mail-front
    volumes:
      - mail_mail_data:/mail
      - mail_overrides:/overrides:ro
    networks:
      - mail-network
    restart: always

  mail-smtp:
    image: ghcr.io/mailu/postfix:2024.06
    container_name: mail-smtp
    env_file: mailu.env
    depends_on:
      - mail-front
    volumes:
      - mail_queue:/queue
      - mail_overrides:/overrides:ro
    networks:
      - mail-network
    restart: always

  mail-antispam:
    image: ghcr.io/mailu/rspamd:2024.06
    container_name: mail-antispam
    env_file: mailu.env
    depends_on:
      - mail-front
      - mail-redis
    volumes:
      - mail_filter:/var/lib/rspamd
      - mail_overrides:/overrides:ro
    networks:
      - mail-network
    restart: always

  mail-webmail:
    image: ghcr.io/mailu/webmail:2024.06
    container_name: mail-webmail
    env_file: mailu.env
    depends_on:
      - mail-front
    volumes:
      - mail_webmail_data:/data
      - mail_webmail_overrides:/overrides:ro
    networks:
      - mail-network
      - mail-webmail
    restart: always

  # =========================
  # PostgreSQL User Service
  # =========================
  postgres:
    image: postgres:16-alpine
    container_name: postgres-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password123
      POSTGRES_DB: user_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: always

  # =========================
  # Keycloak
  # =========================
  keycloak:
    image: quay.io/keycloak/keycloak:26.6.2
    container_name: keycloak
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/user_db
      KC_DB_USERNAME: postgres
      KC_DB_PASSWORD: password123

      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin

    command:
      - start-dev
      - --import-realm

    ports:
      - "8081:8080"

    volumes:
      - ./realm-export.json:/opt/keycloak/data/import/realm-export.json:ro

    depends_on:
      - postgres
      - mail-front

    networks:
      - default
      - mail-network

    restart: always

  # =========================
  # User Service
  # =========================
  user-service:
    build:
      context: ../user-service
    image: phuongnha/user-service:${USER_SERVICE_TAG:-latest}
    pull_policy: build
    platform: linux/amd64
    container_name: user-service

    ports:
      - "8082:8082"

    environment:
      SERVER_PORT: 8082

      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: user_db
      DB_USER: postgres
      DB_PASSWORD: password123

      KEYCLOAK_SERVER_URL: http://keycloak:8080
      KEYCLOAK_REALM: master

      KEYCLOAK_CLIENT_ID: javafx-client
      KEYCLOAK_ADMIN_CLIENT_ID: javafx-client

      KEYCLOAK_ADMIN_USERNAME: admin
      KEYCLOAK_ADMIN_PASSWORD: admin

      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI: http://keycloak:8080/realms/master
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI: http://keycloak:8080/realms/master/protocol/openid-connect/certs

      INTERNAL_MAIL_DOMAIN: gitlab.handbook.local
      MAILU_API_URL: http://mail-front/api/v1
      MAILU_API_TOKEN: tltn-mailu-api-token-2026
      WEBMAIL_URL: http://${MAIL_HOST:-localhost}:8085/webmail
      MAILBOX_QUOTA_BYTES: 104857600

    depends_on:
      - postgres
      - keycloak
      - mail-front

    networks:
      - default
      - mail-network

    restart: always

  # =========================
  # PostgreSQL Chat Service
  # =========================
  chat-postgres:
    image: postgres:15-alpine
    container_name: chat-db

    environment:
      POSTGRES_DB: chat_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres

    ports:
      - "5433:5432"

    volumes:
      - chat_postgres_data:/var/lib/postgresql/data

    restart: always

  # =========================
  # Chat Service
  # =========================
  chat-service:
    build:
      context: ../chat-service
    image: phuongnha/chat-service:${CHAT_SERVICE_TAG:-latest}
    pull_policy: build
    platform: linux/amd64
    container_name: chat-service

    ports:
      - "8083:8083"

    environment:
      SPRING_PROFILES_ACTIVE: dev

      SERVER_PORT: 8083

      DB_HOST: chat-postgres
      DB_PORT: 5432
      DB_NAME: chat_db
      DB_USER: postgres
      DB_PASSWORD: postgres

      USER_SERVICE_URL: http://user-service:8082

      # =========================
      # Upload Config
      # =========================
      SPRING_SERVLET_MULTIPART_MAX_FILE_SIZE: 50MB
      SPRING_SERVLET_MULTIPART_MAX_REQUEST_SIZE: 50MB

    depends_on:
      - chat-postgres
      - user-service

    volumes:
      - chat_uploads:/app/uploads

    restart: always

  # =========================
  # AI RAG BOT
  # =========================
  ai-rag-bot:
    image: phuongnha/ai-rag-bot:${AI_RAG_BOT_TAG:-latest}
    pull_policy: always
    platform: linux/amd64
    container_name: ai-rag-bot

    ports:
      - "3000:3000"

    environment:
      SERVER_PORT: 3000

      OLLAMA_URL: http://host.docker.internal:11434/api/generate

      PYTHONUNBUFFERED: 1

    extra_hosts:
      - "host.docker.internal:host-gateway"

    volumes:
      - ../ai-rag-bot/ai/src/pipeline/rag_pipeline.py:/app/ai/src/pipeline/rag_pipeline.py:ro
      - ../AI Module/ai/src/api.py:/app/ai/src/api.py:ro

    depends_on:
      - user-service
      - chat-service

    restart: always

  # =========================
  # API Gateway
  # =========================
  api-gateway:
    image: phuongnha/api-gateway:${API_GATEWAY_TAG:-latest}
    pull_policy: always
    platform: linux/amd64
    container_name: api-gateway

    ports:
      - "8088:8088"

    environment:
      SERVER_PORT: 8088

      KEYCLOAK_SERVER_URL: http://keycloak:8080
      KEYCLOAK_REALM: master

      USER_SERVICE_HOST: user-service
      USER_SERVICE_PORT: 8082

      CHAT_SERVICE_HOST: chat-service
      CHAT_SERVICE_PORT: 8083

      AI_RAG_BOT_HOST: ai-rag-bot
      AI_RAG_BOT_PORT: 3000

      # Define every gateway route here so this compose file is standalone.
      SPRING_CLOUD_GATEWAY_ROUTES_0_ID: user-service-api
      SPRING_CLOUD_GATEWAY_ROUTES_0_URI: http://user-service:8082
      SPRING_CLOUD_GATEWAY_ROUTES_0_PREDICATES_0: Path=/api/users/**

      SPRING_CLOUD_GATEWAY_ROUTES_1_ID: chat-service-api
      SPRING_CLOUD_GATEWAY_ROUTES_1_URI: http://chat-service:8083
      SPRING_CLOUD_GATEWAY_ROUTES_1_PREDICATES_0: Path=/api/user/**,/api/conversations/**,/api/groups/**,/api/messages/**,/api/friends/**

      SPRING_CLOUD_GATEWAY_ROUTES_2_ID: chat-service-websocket
      SPRING_CLOUD_GATEWAY_ROUTES_2_URI: ws://chat-service:8083
      SPRING_CLOUD_GATEWAY_ROUTES_2_PREDICATES_0: Path=/ws,/ws/**

      SPRING_CLOUD_GATEWAY_ROUTES_3_ID: ai-rag-bot-api
      SPRING_CLOUD_GATEWAY_ROUTES_3_URI: http://ai-rag-bot:3000
      SPRING_CLOUD_GATEWAY_ROUTES_3_PREDICATES_0: Path=/api/ai/**
      SPRING_CLOUD_GATEWAY_ROUTES_3_FILTERS_0: StripPrefix=2

      INTERNAL_SECRET_KEY: tltn-internal-secret-key-2026

      FRONTEND_URL: http://localhost:3000

      # =========================
      # Upload Config
      # =========================
      SPRING_SERVLET_MULTIPART_MAX_FILE_SIZE: 50MB
      SPRING_SERVLET_MULTIPART_MAX_REQUEST_SIZE: 50MB

    depends_on:
      - user-service
      - chat-service
      - ai-rag-bot
      - keycloak

    restart: always

volumes:
  postgres_data:
  chat_postgres_data:
  chat_uploads:
  mail_redis_data:
  mail_certs:
  mail_overrides:
  mail_admin_data:
  mail_dkim:
  mail_mail_data:
  mail_queue:
  mail_filter:
  mail_webmail_data:
  mail_webmail_overrides:

networks:
  mail-network:
    ipam:
      config:
        - subnet: 172.31.0.0/16
  mail-webmail:

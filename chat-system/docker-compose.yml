services:

  # =========================
  # Internal Mail
  # =========================
  mailserver:
    image: ghcr.io/docker-mailserver/docker-mailserver:15.0.2
    container_name: mailserver
    hostname: mail.gitlab.handbook.local
    ports:
      - "587:587"
      - "993:993"
    environment:
      ACCOUNT_PROVISIONER: FILE
      SSL_TYPE: manual
      SSL_CERT_PATH: /run/secrets/tls/fullchain.pem
      SSL_KEY_PATH: /run/secrets/tls/privkey.pem
      ENABLE_IMAP: 1
      ENABLE_POP3: 0
      ENABLE_CLAMAV: 0
      ENABLE_RSPAMD: 0
      ENABLE_FAIL2BAN: 0
      ENABLE_AMAVIS: 0
      ENABLE_POSTGREY: 0
      ENABLE_OPENDKIM: 0
      ENABLE_OPENDMARC: 0
      PERMIT_DOCKER: connected-networks
      POSTMASTER_ADDRESS: admin@gitlab.handbook.local
      SPOOF_PROTECTION: 1
      ONE_DIR: 1
      LOG_LEVEL: info
      TZ: Asia/Bangkok
    volumes:
      - mail_data:/var/mail
      - mail_state:/var/mail-state
      - mail_logs:/var/log/mail
      - mail_config:/tmp/docker-mailserver
      - ./secrets/tls/mail/fullchain.pem:/run/secrets/tls/fullchain.pem:ro
      - ./secrets/tls/mail/privkey.pem:/run/secrets/tls/privkey.pem:ro
    networks:
      mail-network:
        aliases:
          - mail.gitlab.handbook.local
    stop_grace_period: 1m
    restart: always

  mail-account-manager:
    build:
      context: ../mail-service/account-manager
    image: secretchat/mail-account-manager:latest
    container_name: mail-account-manager
    environment:
      MAIL_ACCOUNT_API_TOKEN: ${MAIL_ACCOUNT_API_TOKEN:?Set MAIL_ACCOUNT_API_TOKEN in chat-system/.env}
      MAILSERVER_CONTAINER: mailserver
      MAIL_DOMAIN: gitlab.handbook.local
      IMAP_HOST: mail.gitlab.handbook.local
      IMAP_PORT: 993
      IMAP_USE_SSL: "true"
      TLS_HOSTNAME: mail.gitlab.handbook.local
      TLS_CA_FILE: /run/secrets/tls/ca.pem
      INITIAL_ADMIN_EMAIL: admin@gitlab.handbook.local
      INITIAL_ADMIN_PASSWORD: ${INITIAL_MAIL_ADMIN_PASSWORD:?Set INITIAL_MAIL_ADMIN_PASSWORD in chat-system/.env}
      TZ: Asia/Bangkok
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - mail_config:/mail-config
      - ./secrets/tls/mail/ca.pem:/run/secrets/tls/ca.pem:ro
    depends_on:
      - mailserver
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8080/health', timeout=2)"
      interval: 10s
      timeout: 3s
      retries: 12
    networks:
      - mail-network
    restart: unless-stopped

  roundcube-db:
    image: postgres:16-alpine
    container_name: roundcube-db
    environment:
      POSTGRES_DB: roundcube
      POSTGRES_USER: roundcube
      POSTGRES_PASSWORD: ${ROUNDCUBE_DB_PASSWORD:?Set ROUNDCUBE_DB_PASSWORD in chat-system/.env}
    volumes:
      - roundcube_db_data:/var/lib/postgresql/data
    networks:
      - mail-network
    restart: always

  roundcube:
    build:
      context: ../mail-service/roundcube
    image: secretchat/roundcube:1.7.1-apache
    container_name: roundcube
    ports:
      - "8085:443"
    environment:
      ROUNDCUBEMAIL_DB_TYPE: pgsql
      ROUNDCUBEMAIL_DB_HOST: roundcube-db
      ROUNDCUBEMAIL_DB_PORT: 5432
      ROUNDCUBEMAIL_DB_NAME: roundcube
      ROUNDCUBEMAIL_DB_USER: roundcube
      ROUNDCUBEMAIL_DB_PASSWORD: ${ROUNDCUBE_DB_PASSWORD:?Set ROUNDCUBE_DB_PASSWORD in chat-system/.env}
      ROUNDCUBEMAIL_DEFAULT_HOST: ssl://mail.gitlab.handbook.local
      ROUNDCUBEMAIL_DEFAULT_PORT: 993
      ROUNDCUBEMAIL_SMTP_SERVER: tls://mail.gitlab.handbook.local
      ROUNDCUBEMAIL_SMTP_PORT: 587
      ROUNDCUBEMAIL_USERNAME_DOMAIN: gitlab.handbook.local
      ROUNDCUBEMAIL_PLUGINS: archive,zipdownload,password
      ROUNDCUBEMAIL_UPLOAD_MAX_FILESIZE: 50M
    depends_on:
      mail-account-manager:
        condition: service_healthy
      roundcube-db:
        condition: service_started
    volumes:
      - ../mail-service/roundcube-config:/var/roundcube/config:ro
      - ../mail-service/roundcube-config/webmail-redirect.conf:/etc/apache2/conf-enabled/webmail-redirect.conf:ro
      - ./secrets/tls/mail/ca.pem:/run/secrets/tls/mail-ca.pem:ro
      - ./secrets/tls/webmail/fullchain.pem:/run/secrets/tls/fullchain.pem:ro
      - ./secrets/tls/webmail/privkey.pem:/run/secrets/tls/privkey.pem:ro
    networks:
      - mail-network
    restart: always

  # =========================
  # PostgreSQL User Service
  # =========================
  postgres:
    image: postgres:16-alpine
    container_name: postgres-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${USER_DB_PASSWORD:?Set USER_DB_PASSWORD in chat-system/.env}
      POSTGRES_DB: user_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: always

  # =========================
  # Keycloak
  # =========================
  keycloak:
    image: quay.io/keycloak/keycloak:26.6.2
    container_name: keycloak
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/user_db
      KC_DB_USERNAME: postgres
      KC_DB_PASSWORD: ${USER_DB_PASSWORD:?Set USER_DB_PASSWORD in chat-system/.env}

      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?Set KEYCLOAK_ADMIN_PASSWORD in chat-system/.env}
      KC_HTTP_ENABLED: "true"
      KC_HOSTNAME: https://${PUBLIC_HOSTNAME:?Set PUBLIC_HOSTNAME in chat-system/.env}:8081
      KC_HTTPS_CERTIFICATE_FILE: /run/secrets/tls/fullchain.pem
      KC_HTTPS_CERTIFICATE_KEY_FILE: /run/secrets/tls/privkey.pem
      KC_TRUSTSTORE_PATHS: /run/secrets/tls/mail-ca.pem

    command:
      - start
      - --import-realm

    ports:
      - "8081:8443"

    volumes:
      - ./realm-export.json:/opt/keycloak/data/import/realm-export.json:ro
      - ./secrets/tls/keycloak/fullchain.pem:/run/secrets/tls/fullchain.pem:ro
      - ./secrets/tls/keycloak/privkey.pem:/run/secrets/tls/privkey.pem:ro
      - ./secrets/tls/mail/ca.pem:/run/secrets/tls/mail-ca.pem:ro

    depends_on:
      - postgres
      - mailserver

    networks:
      - default
      - mail-network

    restart: always

  # =========================
  # User Service
  # =========================
  user-service:
    build:
      context: ../user-service
    image: phuongnha/user-service:${USER_SERVICE_TAG:-latest}
    pull_policy: build
    platform: linux/amd64
    container_name: user-service

    environment:
      SERVER_PORT: 8082

      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: user_db
      DB_USER: postgres
      DB_PASSWORD: ${USER_DB_PASSWORD:?Set USER_DB_PASSWORD in chat-system/.env}

      KEYCLOAK_SERVER_URL: http://keycloak:8080
      KEYCLOAK_REALM: master

      KEYCLOAK_CLIENT_ID: javafx-client
      KEYCLOAK_ADMIN_CLIENT_ID: javafx-client

      KEYCLOAK_ADMIN_USERNAME: admin
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?Set KEYCLOAK_ADMIN_PASSWORD in chat-system/.env}

      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI: https://${PUBLIC_HOSTNAME:?Set PUBLIC_HOSTNAME in chat-system/.env}:8081/realms/master
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI: http://keycloak:8080/realms/master/protocol/openid-connect/certs

      INTERNAL_MAIL_DOMAIN: gitlab.handbook.local
      MAIL_ACCOUNT_API_URL: http://mail-account-manager:8080
      MAIL_ACCOUNT_API_TOKEN: ${MAIL_ACCOUNT_API_TOKEN:?Set MAIL_ACCOUNT_API_TOKEN in chat-system/.env}
      WEBMAIL_URL: https://${PUBLIC_HOSTNAME:?Set PUBLIC_HOSTNAME in chat-system/.env}:8085/
      MAILBOX_QUOTA_BYTES: 104857600

    depends_on:
      - postgres
      - keycloak
      - mail-account-manager

    networks:
      - default
      - mail-network

    restart: always

  # =========================
  # PostgreSQL Chat Service
  # =========================
  chat-postgres:
    image: postgres:15-alpine
    container_name: chat-db

    environment:
      POSTGRES_DB: chat_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${CHAT_DB_PASSWORD:?Set CHAT_DB_PASSWORD in chat-system/.env}

    volumes:
      - chat_postgres_data:/var/lib/postgresql/data

    restart: always

  # =========================
  # Redis Presence
  # =========================
  redis:
    image: redis:7.4-alpine
    container_name: redis
    command: ["sh", "-c", "exec redis-server --appendonly yes --requirepass \"$$REDIS_PASSWORD\""]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD in chat-system/.env}
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep PONG"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: always

  # =========================
  # Chat Service
  # =========================
  chat-service:
    build:
      context: ../chat-service
    image: phuongnha/chat-service:${CHAT_SERVICE_TAG:-latest}
    pull_policy: build
    platform: linux/amd64
    container_name: chat-service

    environment:
      SPRING_PROFILES_ACTIVE: dev

      SERVER_PORT: 8083

      DB_HOST: chat-postgres
      DB_PORT: 5432
      DB_NAME: chat_db
      DB_USER: postgres
      DB_PASSWORD: ${CHAT_DB_PASSWORD:?Set CHAT_DB_PASSWORD in chat-system/.env}

      USER_SERVICE_URL: http://user-service:8082
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD in chat-system/.env}
      PRESENCE_TTL: 75s
      KEYCLOAK_SERVER_URL: http://keycloak:8080
      KEYCLOAK_REALM: master
      JWT_ISSUER_URI: https://${PUBLIC_HOSTNAME:?Set PUBLIC_HOSTNAME in chat-system/.env}:8081/realms/master
      JWT_JWK_SET_URI: http://keycloak:8080/realms/master/protocol/openid-connect/certs

      # =========================
      # Upload Config
      # =========================
      SPRING_SERVLET_MULTIPART_MAX_FILE_SIZE: 50MB
      SPRING_SERVLET_MULTIPART_MAX_REQUEST_SIZE: 50MB

    depends_on:
      - chat-postgres
      - user-service
      - keycloak
      - redis

    volumes:
      - chat_uploads:/app/uploads

    restart: always

  # =========================
  # AI RAG BOT
  # =========================
  ai-rag-bot:
    image: phuongnha/ai-rag-bot:${AI_RAG_BOT_TAG:-latest}
    pull_policy: always
    platform: linux/amd64
    container_name: ai-rag-bot

    environment:
      SERVER_PORT: 3000

      OLLAMA_URL: http://host.docker.internal:11434/api/generate

      PYTHONUNBUFFERED: 1

    extra_hosts:
      - "host.docker.internal:host-gateway"

    volumes:
      - ../ai-rag-bot/ai/src/pipeline/rag_pipeline.py:/app/ai/src/pipeline/rag_pipeline.py:ro
      - ../AI Module/ai/src/api.py:/app/ai/src/api.py:ro

    depends_on:
      - user-service
      - chat-service

    restart: always

  # =========================
  # API Gateway
  # =========================
  api-gateway:
    build:
      context: ../api-gateway
    image: phuongnha/api-gateway:${API_GATEWAY_TAG:-latest}
    pull_policy: build
    platform: linux/amd64
    container_name: api-gateway

    ports:
      - "8088:8443"

    environment:
      SERVER_PORT: 8443
      SERVER_SSL_CERTIFICATE: file:/run/secrets/tls/fullchain.pem
      SERVER_SSL_CERTIFICATE_PRIVATE_KEY: file:/run/secrets/tls/privkey.pem

      KEYCLOAK_SERVER_URL: http://keycloak:8080
      KEYCLOAK_ISSUER_URI: https://${PUBLIC_HOSTNAME:?Set PUBLIC_HOSTNAME in chat-system/.env}:8081
      KEYCLOAK_JWK_SET_URI: http://keycloak:8080/realms/master/protocol/openid-connect/certs
      KEYCLOAK_REALM: master

      USER_SERVICE_HOST: user-service
      USER_SERVICE_PORT: 8082

      CHAT_SERVICE_HOST: chat-service
      CHAT_SERVICE_PORT: 8083

      AI_RAG_BOT_HOST: ai-rag-bot
      AI_RAG_BOT_PORT: 3000

      # Define every gateway route here so this compose file is standalone.
      SPRING_CLOUD_GATEWAY_ROUTES_0_ID: user-service-api
      SPRING_CLOUD_GATEWAY_ROUTES_0_URI: http://user-service:8082
      SPRING_CLOUD_GATEWAY_ROUTES_0_PREDICATES_0: Path=/api/users/**

      SPRING_CLOUD_GATEWAY_ROUTES_1_ID: chat-service-api
      SPRING_CLOUD_GATEWAY_ROUTES_1_URI: http://chat-service:8083
      SPRING_CLOUD_GATEWAY_ROUTES_1_PREDICATES_0: Path=/api/user/**,/api/conversations/**,/api/groups/**,/api/messages/**,/api/friends/**,/api/presence/**

      SPRING_CLOUD_GATEWAY_ROUTES_2_ID: chat-service-websocket
      SPRING_CLOUD_GATEWAY_ROUTES_2_URI: ws://chat-service:8083
      SPRING_CLOUD_GATEWAY_ROUTES_2_PREDICATES_0: Path=/ws,/ws/**

      SPRING_CLOUD_GATEWAY_ROUTES_3_ID: ai-rag-bot-api
      SPRING_CLOUD_GATEWAY_ROUTES_3_URI: http://ai-rag-bot:3000
      SPRING_CLOUD_GATEWAY_ROUTES_3_PREDICATES_0: Path=/api/ai/**
      SPRING_CLOUD_GATEWAY_ROUTES_3_FILTERS_0: StripPrefix=2

      INTERNAL_SECRET_KEY: ${INTERNAL_SECRET_KEY:?Set INTERNAL_SECRET_KEY in chat-system/.env}

      FRONTEND_URL: https://${PUBLIC_HOSTNAME:?Set PUBLIC_HOSTNAME in chat-system/.env}:3000

      # =========================
      # Upload Config
      # =========================
      SPRING_SERVLET_MULTIPART_MAX_FILE_SIZE: 50MB
      SPRING_SERVLET_MULTIPART_MAX_REQUEST_SIZE: 50MB

    depends_on:
      - user-service
      - chat-service
      - ai-rag-bot
      - keycloak

    volumes:
      - ./secrets/tls/gateway/fullchain.pem:/run/secrets/tls/fullchain.pem:ro
      - ./secrets/tls/gateway/privkey.pem:/run/secrets/tls/privkey.pem:ro

    restart: always

volumes:
  postgres_data:
  chat_postgres_data:
  chat_uploads:
  mail_data:
  mail_state:
  mail_logs:
  mail_config:
  roundcube_db_data:
  redis_data:

networks:
  mail-network:
    ipam:
      config:
        - subnet: 172.31.0.0/16

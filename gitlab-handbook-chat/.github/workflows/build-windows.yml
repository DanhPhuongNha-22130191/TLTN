name: Build Windows App

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch: # Cho phép tự trigger bằng tay trên Github

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: maven

    - name: Build with Maven and create JLink Image
      run: mvn clean javafx:jlink

    - name: Rename and Prepare folder
      run: |
        Rename-Item -Path "target\app" -NewName "SecretChat-Windows"
        # Tạo một file shortcut hoặc hướng dẫn chạy ở ngoài cho dễ
        Set-Content -Path "target\SecretChat-Windows\Huong_dan_chay.txt" -Value "Vao thu muc bin, click dup vao file app.bat de chay ung dung SecretChat."

    - name: Upload Windows Artifact
      uses: actions/upload-artifact@v4
      with:
        name: SecretChat-Windows
        path: target/SecretChat-Windows

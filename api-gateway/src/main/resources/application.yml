              - PATCH
              - DELETE
              - OPTIONS
            allowedHeaders: "*"
            exposedHeaders: "*"
            allowCredentials: true

      routes:
        - id: user-service-api
          uri: http://${USER_SERVICE_HOST}:${USER_SERVICE_PORT}
          predicates:
            - Path=/api/users/**

        - id: chat-service-api
          uri: http://${CHAT_SERVICE_HOST}:${CHAT_SERVICE_PORT}
          predicates:
            - Path=/api/user/**,/api/conversations/**,/api/groups/**,/api/messages/**,/api/friends/**,/api/presence/**

        - id: chat-service-websocket
          uri: ws://${CHAT_SERVICE_HOST}:${CHAT_SERVICE_PORT}
          predicates:
            - Path=/ws/**

app:
  internal-secret: ${INTERNAL_SECRET_KEY}

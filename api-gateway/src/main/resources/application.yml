server:
  port: ${SERVER_PORT}

spring:
  config:
    import: optional:file:.env[.properties]

  application:
    name: api-gateway

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:${KEYCLOAK_SERVER_URL}}/realms/${KEYCLOAK_REALM}
          jwk-set-uri: ${KEYCLOAK_JWK_SET_URI:${KEYCLOAK_SERVER_URL}/realms/${KEYCLOAK_REALM}/protocol/openid-connect/certs}

  cloud:
    gateway:
      globalcors:
        corsConfigurations:
          '[/**]':
            allowedOrigins:
              - ${FRONTEND_URL}
            allowedMethods:
              - GET
              - POST
              - PUT
              - PATCH
              - DELETE
              - OPTIONS
            allowedHeaders: "*"

      routes:
        - id: user-service-api
          uri: http://${USER_SERVICE_HOST}:${USER_SERVICE_PORT}
          predicates:
            - Path=/api/users/**

        - id: chat-service-api
          uri: http://${CHAT_SERVICE_HOST}:${CHAT_SERVICE_PORT}
          predicates:
            - Path=/api/user/**,/api/conversations/**,/api/groups/**,/api/messages/**,/api/friends/**,/api/presence/**

        - id: chat-service-websocket
          uri: ws://${CHAT_SERVICE_HOST}:${CHAT_SERVICE_PORT}
          predicates:
            - Path=/ws/**

app:
  internal-secret: ${INTERNAL_SECRET_KEY}
